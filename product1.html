<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vintage Jacket | Retro 舊物部</title>
  <style>
    :root {
      --bg-color: #4a0404;
      --card-bg: #2d0202;
      --accent-red: #ff3333;
      --text-main: #ffffff;
      --text-muted: #e0c0c0;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background-color: var(--card-bg);
      padding: 25px;
      border-radius: 8px;
      border: 1px solid #5e0808;
    }

    .back-btn {
      display: inline-block;
      color: #ff9999;
      text-decoration: none;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .product-title {
      font-size: 1.5rem;
      margin-top: 0;
    }

    .product-price {
      font-size: 1.3rem;
      color: #ff9999;
      font-weight: bold;
      margin-bottom: 20px;
    }

    /* 多圖展示區 */
    .image-gallery {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 25px;
    }

    .image-gallery img {
      width: 100%;
      border-radius: 6px;
      border: 1px solid #5e0808;
      display: block;
    }

    .product-desc {
      line-height: 1.8;
      color: var(--text-muted);
      margin-bottom: 25px;
      border-top: 1px solid #5e0808;
      padding-top: 15px;
    }

    .ig-btn {
      display: block;
      width: 100%;
      padding: 12px 0;
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      border-radius: 4px;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-btn">← 返回主頁 Catalog</a>

    <h1 class="product-title">90s Vintage Jacket</h1>
    <div class="product-price">HKD $1,280</div>

    <!-- 精確對應你資料夾檔名的圖片區塊 -->
    <div class="image-gallery">
      <img src="jacket1.-detail2.jpg" alt="細節圖 2">
      <img src="jacket1.-detail3.jpg" alt="細節圖 3">
      <img src="jacket1.-detail4.jpg" alt="細節圖 4">
      <img src="jacket1.-detail5.jpg" alt="細節圖 5">
      <img src="jacket1.-detail6.jpg" alt="細節圖 6">
    </div>

    <!-- 商品詳細描述 -->
    <div class="product-desc">
      <p><strong>【商品狀態與尺寸資訊】</strong></p>
      <ul>
        <li>尺寸：L（肩寬 50cm / 胸寬 58cm / 衣長 68cm）</li>
        <li>成色：90% New，拉鏈運作順暢，無明顯破損或污漬</li>
        <li>產地：Made in Japan</li>
        <li>說明：90 年代古著經典款式，質感厚實，版型俐落。</li>
      </ul>
    </div>

    <!-- 跳轉至 IG DM 留貨 -->
    <a href="https://www.instagram.com/direct/t/retro_vintage90s" target="_blank" class="ig-btn">💬 私訊 IG DM 留貨 / 查詢</a>
  </div>

</body>
</html>
