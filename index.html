<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro 舊物部 | Vintage & Archive Selection</title>
  <style>
    :root {
      /* 全局深紅底色 */
      --bg-color: #4a0404; 
      --card-bg: #2d0202;
      --accent-red: #ff3333;
      --bright-red: #ff4d4d;
      --text-main: #ffffff;
      --text-muted: #e0c0c0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }

    /* 頂部跑馬燈 */
    .announcement-bar {
      background-color: #1f0101;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: bold;
      padding: 6px 0;
      overflow: hidden;
      white-space: nowrap;
      border-bottom: 1px solid var(--accent-red);
    }

    .marquee-content {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 18s linear infinite;
    }

    @keyframes marquee {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-100%, 0); }
    }

    /* 頂部導航 */
    header {
      background-color: #2d0202;
      border-bottom: 2px solid var(--bright-red);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 2px;
    }

    .nav-links {
      display: flex;
      gap: 12px;
      font-size: 0.85rem;
    }

    .nav-links a {
      color: #ffcccc;
      text-decoration: none;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    .lang-btn {
      background: transparent;
      border: 1px solid #ffffff;
      color: #ffffff;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .lang-btn:hover {
      background-color: #ffffff;
      color: var(--bg-color);
    }

    /* Hero 動態 Logo */
    .hero {
      text-align: center;
      padding: 40px 20px 20px;
      background: radial-gradient(circle, #730606 0%, var(--bg-color) 85%);
    }

    .logo-container {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 0 auto 15px;
      cursor: pointer;
    }

    .logo-container img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: opacity 0.5s ease-in-out, transform 0.5s ease;
    }

    .logo-silver {
      opacity: 0;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.6));
    }

    .logo-red {
      opacity: 1;
      filter: drop-shadow(0 0 12px rgba(0, 0, 0, 0.5));
    }

    .logo-container:hover .logo-red {
      opacity: 0;
    }

    .logo-container:hover .logo-silver {
      opacity: 1;
      transform: scale(1.03);
    }

    .slogan {
      font-size: 0.95rem;
      color: #ffffff;
      margin-top: 10px;
      font-weight: 500;
    }

    /* 分類按鈕 Filter */
    .filter-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 25px 0 15px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background-color: #2d0202;
      border: 1px solid #ff6666;
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.3s;
    }

    .filter-btn:hover, .filter-btn.active {
      background-color: #ffffff;
      color: var(--bg-color);
      border-color: #ffffff;
      font-weight: bold;
    }

    /* 商品列表 */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 10px 20px 40px;
    }

    .section-title {
      font-size: 1.3rem;
      border-left: 4px solid #ffffff;
      padding-left: 10px;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    /* 點擊整個卡片跳轉 */
    .card-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid #5e0808;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #ffffff;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
    }

    .card-img {
      width: 100%;
      height: 280px;
      background-color: #1a0101;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      border-bottom: 1px solid #5e0808;
      overflow: hidden;
    }

    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
    }

    .card-title {
      font-size: 1rem;
      margin: 0 0 6px 0;
      color: #ffffff;
    }

    .card-price {
      color: #ff9999;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 12px;
    }

    /* 按鈕樣式 */
    .ig-btn {
      display: block;
      width: 100%;
      padding: 9px 0;
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: #ffffff;
      text-align: center;
      font-weight: bold;
      font-size: 0.85rem;
      border-radius: 4px;
      box-sizing: border-box;
    }

    footer {
      text-align: center;
      padding: 25px;
      border-top: 1px solid #5e0808;
      color: var(--text-muted);
      font-size: 0.85rem;
      background-color: #1f0101;
    }

    footer a {
      color: #ff9999;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="announcement-bar">
    <div class="marquee-content" id="announcementText">
      我們相信：真正的好衣服，從來不會過時，只會等對的人。
    </div>
  </div>

  <header>
    <div class="nav-left">
      <div class="brand-title">RETRO 舊物部</div>
      <div class="nav-links">
        <a href="#catalog">選品 Catalog</a>
        <a href="https://www.instagram.com/direct/t/retro_vintage90s" target="_blank">IG Direct 聯絡</a>
      </div>
    </div>
    <button class="lang-btn" onclick="toggleLang()" id="langBtn">EN</button>
  </header>

  <section class="hero">
    <div class="logo-container">
      <img src="logo-red.png" alt="Retro 舊物部 Red Logo" class="logo-red">
      <img src="logo-silver.png" alt="Retro 舊物部 Silver Logo" class="logo-silver">
    </div>
    <div class="slogan" id="sloganText">專注於古著與經典選品 • 每款單品僅此一件</div>

    <!-- 分類按鈕 Filter -->
    <div class="filter-container">
      <button class="filter-btn active">ALL 全部</button>
      <button class="filter-btn">90s Vintage</button>
      <button class="filter-btn">Denim 丹寧</button>
      <button class="filter-btn">Jacket 外套</button>
    </div>
  </section>

  <main class="container" id="catalog">
    <h2 class="section-title" id="catalogTitle">選品 Catalog</h2>
    
    <div class="grid">
      <!-- 商品 1：點擊直接進入 product1.html 詳情頁 -->
      <a href="product1.html" class="card-link">
        <div class="card">
          <div class="card-img">
            <img src="jacket1.-detail2.jpg" alt="Vintage Jacket">
          </div>
          <div class="card-content">
            <h3 class="card-title">Vintage Jacket</h3>
            <div class="card-price">HKD $1,280</div>
            <div class="ig-btn">🔍 查看更多細節 / 購買</div>
          </div>
        </div>
      </a>

      <!-- 商品 2：直接連至 IG DM 查詢 -->
      <a href="https://www.instagram.com/direct/t/retro_vintage90s" target="_blank" class="card-link">
        <div class="card">
          <div class="card-img">[ 商品圖片 2 ]</div>
          <div class="card-content">
            <h3 class="card-title">Retro Accessories</h3>
            <div class="card-price">HKD $580</div>
            <div class="ig-btn">💬 IG DM 留貨 / 查詢</div>
          </div>
        </div>
      </a>
    </div>
  </main>

  <footer>
    <p>RETRO 舊物部 • Instagram: <a href="https://www.instagram.com/retro_vintage90s/" target="_blank">@retro_vintage90s</a></p>
    <p>&copy; 2026 Retro Vintage 90s. All rights reserved.</p>
  </footer>

  <script>
    let currentLang = 'zh';

    function toggleLang() {
      const langBtn = document.getElementById('langBtn');
      const slogan = document.getElementById('sloganText');
      const catalog = document.getElementById('catalogTitle');
      const announcement = document.getElementById('announcementText');

      if (currentLang === 'zh') {
        currentLang = 'en';
        langBtn.innerText = '中文';
        slogan.innerText = 'Focused on Vintage Selects • Unique One-of-a-Kind Items';
        catalog.innerText = 'Catalog';
        announcement.innerText = 'True style never fades.';
      } else {
        currentLang = 'zh';
        langBtn.innerText = 'EN';
        slogan.innerText = '專注於古著與經典選品 • 每款單品僅此一件';
        catalog.innerText = '選品 Catalog';
        announcement.innerText = '我們相信：真正的好衣服，從來不會過時，只會等對的人。';
      }
    }
  </script>
</body>
</html>
