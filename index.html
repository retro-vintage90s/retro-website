<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro 舊物部 | Vintage & Archive Selection</title>
  <style>
    :root {
      --bg-color: #4a0404;
      --card-bg: #2d0202;
      --accent-red: #ff3333;
      --text-main: #ffffff;
      --text-muted: #e0c0c0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    header {
      padding: 30px 20px;
      text-align: center;
      background-color: var(--card-bg);
      border-bottom: 2px solid #5e0808;
    }

    .logo-container img {
      max-width: 180px;
      height: auto;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 10px;
    }

    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .filter-btn {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid #5e0808;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background-color: var(--accent-red);
      border-color: var(--accent-red);
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .section-title {
      font-size: 1.2rem;
      margin-bottom: 20px;
      border-left: 4px solid var(--accent-red);
      padding-left: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .card-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #5e0808;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .card-img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 15px;
    }

    .card-title {
      font-size: 1rem;
      margin: 0 0 8px 0;
      font-weight: bold;
    }

    .card-price {
      color: #ff9999;
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .ig-btn {
      display: block;
      width: 100%;
      padding: 8px 0;
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      border-radius: 4px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="logo-silver.png" alt="Retro 舊物部">
    </div>
    <div class="subtitle">專注於古著與經典選品 • Archive Selection</div>
  </header>

  <div class="filter-bar">
    <button class="filter-btn active">ALL 全部</button>
    <button class="filter-btn">90s Vintage</button>
    <button class="filter-btn">Denim 丹寧</button>
    <button class="filter-btn">Jacket 外套</button>
  </div>

  <main class="container">
    <h2 class="section-title">選品 Catalog</h2>

    <div class="grid">
      <a href="product1.html" class="card-link">
        <div class="card">
          <img src="jacket1.jpg" alt="Vintage Jacket" class="card-img">
          <div class="card-content">
            <h3 class="card-title">Vintage Jacket</h3>
            <div class="card-price">HKD $1,280</div>
            <div class="ig-btn">🔍 查看更多細節 / 購買</div>
          </div>
        </div>
      </a>
    </div>
  </main>

</body>
</html>
