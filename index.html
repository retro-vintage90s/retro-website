<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro 舊物部</title>
  <style>
    :root {
      --bg-color: #080303;
      --card-bg: #140707;
      --accent-red: #8b0000;
      --bright-red: #d62828;
      --silver: #e0e0e0;
      --silver-glow: rgba(224, 224, 224, 0.4);
      --text-main: #f0f0f0;
      --text-muted: #a09090;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }

    /* 頂部跑馬燈公告 */
    .announcement-bar {
      background-color: var(--bright-red);
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: bold;
      padding: 6px 0;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }

    .marquee-content {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 18s linear infinite;
    }

    @keyframes marquee {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-100%, 0); }
    }

    /* 頂部導航 */
    header {
      background: linear-gradient(180deg, #1f0505 0%, var(--bg-color) 100%);
      border-bottom: 1px solid var(--accent-red);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--text-main);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 8px var(--accent-red);
    }

    .lang-btn {
      background: transparent;
      border: 1px solid var(--bright-red);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .lang-btn:hover {
      background-color: var(--bright-red);
      box-shadow: 0 0 10px var(--bright-red);
    }

    /* Hero 動態 Logo 區塊 */
    .hero {
      text-align: center;
      padding: 40px 20px 20px;
      background: radial-gradient(circle, #2d0a0a 0%, var(--bg-color) 70%);
    }

    .logo-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 0 auto 15px;
      cursor: pointer;
    }

    .logo-container img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: opacity 0.5s ease-in-out, transform 0.5s ease;
    }

    .logo-silver {
      opacity: 0;
      filter: drop-shadow(0 0 12px var(--silver-glow));
    }

    .logo-red {
      opacity: 1;
      filter: drop-shadow(0 0 12px rgba(214, 40, 40, 0.6));
    }

    .logo-container:hover .logo-red {
      opacity: 0;
    }

    .logo-container:hover .logo-silver {
      opacity: 1;
      transform: scale(1.03);
    }

    .slogan {
      font-size: 1rem;
      color: var(--silver);
      letter-spacing: 1px;
      margin-top: 10px;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
    }

    /* 商品列表 */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .section-title {
      font-size: 1.4rem;
      border-left: 4px solid var(--bright-red);
      padding-left: 10px;
      margin-bottom: 25px;
      color: var(--silver);
      text-shadow: 0 0 8px var(--accent-red);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid #2a0c0c;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--bright-red);
      box-shadow: 0 5px 15px rgba(214, 40, 40, 0.3);
    }

    .card-img {
      width: 100%;
      height: 240px;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      border-bottom: 1px solid #2a0c0c;
    }

    .card-content {
      padding: 18px;
    }

    .card-title {
      font-size: 1.1rem;
      margin: 0 0 8px 0;
      color: var(--text-main);
    }

    .card-price {
      color: var(--bright-red);
      font-size: 1.2rem;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px;
      border-top: 1px solid #2a0c0c;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <div class="announcement-bar">
    <div class="marquee-content" id="announcementText">
      我們相信：真正的好衣服，從來不會過時，只會等對的人。
    </div>
  </div>

  <header>
    <div class="brand-title">RETRO 舊物部</div>
    <button class="lang-btn" onclick="toggleLang()" id="langBtn">EN</button>
  </header>

  <section class="hero">
    <div class="logo-container">
      <img src="logo-red.png" alt="Retro 舊物部 Red Logo" class="logo-red">
      <img src="logo-silver.png" alt="Retro 舊物部 Silver Logo" class="logo-silver">
    </div>
    <div class="slogan" id="sloganText">專注於古著與經典選品 • 每款單品僅此一件</div>
  </section>

  <main class="container">
    <h2 class="section-title" id="catalogTitle">選品 Catalog</h2>
    
    <div class="grid">
      <div class="card">
        <div class="card-img">[ 商品圖片 1 ]</div>
        <div class="card-content">
          <h3 class="card-title">Vintage Jacket</h3>
          <div class="card-price">HKD $1,280</div>
        </div>
      </div>

      <div class="card">
        <div class="card-img">[ 商品圖片 2 ]</div>
        <div class="card-content">
          <h3 class="card-title">Retro Accessories</h3>
          <div class="card-price">HKD $580</div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 Retro Vintage 90s. All rights reserved.
  </footer>

  <script>
    let currentLang = 'zh';

    function toggleLang() {
      const langBtn = document.getElementById('langBtn');
      const slogan = document.getElementById('sloganText');
      const catalog = document.getElementById('catalogTitle');
      const announcement = document.getElementById('announcementText');

      if (currentLang === 'zh') {
        currentLang = 'en';
        langBtn.innerText = '中文';
        slogan.innerText = 'Focused on Vintage Selects • Unique One-of-a-Kind Items';
        catalog.innerText = 'Catalog';
        announcement.innerText = 'True style never fades.';
      } else {
        currentLang = 'zh';
        langBtn.innerText = 'EN';
        slogan.innerText = '專注於古著與經典選品 • 每款單品僅此一件';
        catalog.innerText = '選品 Catalog';
        announcement.innerText = '我們相信：真正的好衣服，從來不會過時，只會等對的人。';
      }
    }
  </script>
</body>
</html>
